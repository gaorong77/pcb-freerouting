<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>PCB Freerouting Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh}
header{background:#16213e;padding:10px 20px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #0f3460;flex-shrink:0}
header h1{font-size:16px;color:#e94560;letter-spacing:1px}
.stats{display:flex;gap:16px;margin-left:auto;font-size:12px}
.stat{background:#0f3460;padding:4px 10px;border-radius:4px;color:#a0c4ff}
.stat span{color:#fff;font-weight:bold}
.tab-bar{background:#16213e;display:flex;gap:4px;padding:6px 16px;border-bottom:1px solid #0f3460;flex-shrink:0}
.tab{padding:4px 14px;border-radius:4px;cursor:pointer;font-size:12px;background:#0f3460;color:#888;border:1px solid transparent;transition:.2s}
.tab.active{background:#e94560;color:#fff;border-color:#e94560}
.tab:hover:not(.active){color:#fff;background:#1a3a6e}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;background:#16213e;border-right:1px solid #0f3460;overflow-y:auto;padding:8px;flex-shrink:0;font-size:11px}
.sidebar h3{color:#e94560;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:8px 0 4px}
.net-list{display:flex;flex-direction:column;gap:2px}
.net-item{padding:3px 8px;border-radius:3px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid transparent}
.net-item:hover{background:#1a3a6e}
.net-item.active{background:#0f3460;border-color:#e94560;color:#fff}
.net-item .badge{font-size:10px;padding:1px 5px;border-radius:2px;background:#0f3460}
.net-item .badge.routed{background:#1a6e3a;color:#6ef59a}
.net-item .badge.partial{background:#6e4a1a;color:#f5c46e}
.net-item .badge.open{background:#4a1a1a;color:#f56e6e}
canvas-wrap{flex:1;overflow:hidden;position:relative}
#cvs{display:block;background:#0d0d1a;cursor:crosshair}
.canvas-wrap{flex:1;overflow:hidden;position:relative;display:flex}
.info-bar{background:#16213e;padding:4px 16px;font-size:11px;color:#888;border-top:1px solid #0f3460;flex-shrink:0;display:flex;gap:20px}
.legend{display:flex;gap:12px;align-items:center;margin-left:auto}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px}
.legend-dot{width:10px;height:4px;border-radius:2px}
</style>
</head>
<body>
<header>
  <h1>PCB FREEROUTING VIEWER</h1>
  <div class="stats">
    <div class="stat">Board <span id="sz">—</span></div>
    <div class="stat">Nets <span id="st-nets">—</span></div>
    <div class="stat">Routed <span id="st-routed">—</span></div>
    <div class="stat">Wires <span id="st-wires">—</span></div>
    <div class="stat">Vias <span id="st-vias">—</span></div>
  </div>
</header>
<div class="tab-bar">
  <div class="tab active" data-layer="ALL">All Layers</div>
  <div class="tab" data-layer="TOP">TOP (F.Cu)</div>
  <div class="tab" data-layer="ART02">ART02 (In1)</div>
  <div class="tab" data-layer="ART03">ART03 (In2)</div>
  <div class="tab" data-layer="BOTTOM">BOTTOM (B.Cu)</div>
</div>
<div class="main">
  <div class="sidebar">
    <h3>Layer Colors</h3>
    <div class="legend" style="flex-direction:column;align-items:flex-start;gap:4px;margin:0 0 10px 4px">
      <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div>TOP</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ffd93d"></div>ART02</div>
      <div class="legend-item"><div class="legend-dot" style="background:#6bcb77"></div>ART03</div>
      <div class="legend-item"><div class="legend-dot" style="background:#4d96ff"></div>BOTTOM</div>
      <div class="legend-item"><div class="legend-dot" style="background:#cc88ff;height:8px;border-radius:50%;width:8px"></div>Via</div>
    </div>
    <h3>Net Status</h3>
    <div class="net-list" id="net-list"></div>
  </div>
  <div class="canvas-wrap">
    <canvas id="cvs"></canvas>
  </div>
</div>
<div class="info-bar">
  <span id="pos">x=— y=—</span>
  <span id="hover-info"></span>
  <span style="margin-left:auto">Scroll: zoom | Drag: pan</span>
</div>

<script>
// ─── Layer styles ───────────────────────────────────────────────────────────
const LAYER_COLOR = {
  TOP:    '#ff6b6b',
  ART02:  '#ffd93d',
  ART03:  '#6bcb77',
  BOTTOM: '#4d96ff',
};
const PAD_COLOR   = '#e0b000';
const VIA_COLOR   = '#cc88ff';
const BOARD_COLOR = '#334466';
const KEEPIN_COLOR= '#1a3a5c';

// ─── State ───────────────────────────────────────────────────────────────────
let pcb = null, routing = null;
let activeLayer = 'ALL', activeNet = null;
let viewX=0, viewY=0, scale=1;
let dragging=false, dragX=0, dragY=0;

const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');

// ─── Load data ───────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const [r1, r2] = await Promise.all([
      fetch('pcb_data.json').then(r=>r.json()),
      fetch('routing_result.json').then(r=>r.json()).catch(()=>null),
    ]);
    pcb = r1; routing = r2;
    init();
  } catch(e) {
    // Inline demo mode: try to parse embedded data
    console.warn('Could not load JSON files, using demo mode:', e);
    pcb = window.__PCB_DATA__ || null;
    routing = window.__ROUTING__ || null;
    if (pcb) init();
    else showError(e);
  }
}

function showError(e) {
  ctx.fillStyle = '#e94560';
  ctx.font = '14px monospace';
  ctx.fillText('Error loading data: ' + e.message, 20, 40);
  ctx.fillStyle = '#888';
  ctx.font = '12px monospace';
  ctx.fillText('Make sure pcb_data.json and routing_result.json are in the same folder.', 20, 70);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  // Compute bounding box from board outline
  const segs = pcb.board_outlines[0].segments;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for (const s of segs) {
    for (const pt of [s.start, s.end]) {
      minX=Math.min(minX,pt[0]); maxX=Math.max(maxX,pt[0]);
      minY=Math.min(minY,pt[1]); maxY=Math.max(maxY,pt[1]);
    }
  }
  // Also include all pins
  for (const c of pcb.components) for (const p of c.pins) {
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
  }

  const W = cvs.offsetWidth || 800, H = cvs.offsetHeight || 600;
  const bW = maxX-minX, bH = maxY-minY;
  const margin = 40;
  scale = Math.min((W-margin*2)/bW, (H-margin*2)/bH) * 0.95;

  // Center
  viewX = (W - bW*scale)/2 - minX*scale;
  viewY = (H - bH*scale)/2 - minY*scale;

  // Stats
  document.getElementById('sz').textContent =
    `${(bW/1000).toFixed(1)}×${(bH/1000).toFixed(1)}mm`;

  // Build net status from routing result
  buildNetList();
  resize();
  draw();
}

// ─── Net list ────────────────────────────────────────────────────────────────
const POUR_NETS = new Set(['D_GND','AUDIO_GND','HPH_REF1',
  'USB_VBUS_C1','SPK1_OUT_N1','SPK1_OUT_P1']);

function buildNetList() {
  // All unique route nets from pcb
  const netPins = {};
  for (const c of pcb.components) for (const p of c.pins) {
    const n = p.net;
    if (!n || POUR_NETS.has(n)) continue;
    (netPins[n] = netPins[n]||[]).push(`${c.refdes}.${p.number}`);
  }
  const routedNets = routing ? new Set(Object.keys(routing.net_wire_counts)) : new Set();
  const totalNets = Object.keys(netPins).length;
  const routedCount = routedNets.size;

  document.getElementById('st-nets').textContent = totalNets;
  document.getElementById('st-routed').textContent = `${routedCount}/${totalNets}`;
  document.getElementById('st-wires').textContent = routing ? routing.total_wire_segments : '—';
  document.getElementById('st-vias').textContent  = routing ? routing.total_vias : '—';

  const list = document.getElementById('net-list');
  list.innerHTML = '';
  for (const [name, pins] of Object.entries(netPins).sort()) {
    const routed = routedNets.has(name);
    const status = !routing ? 'open' : routed ? 'routed' : 'open';
    const el = document.createElement('div');
    el.className = 'net-item';
    el.dataset.net = name;
    el.innerHTML = `<span>${name}</span><span class="badge ${status}">${status==='routed'?'✓':status==='open'?'✗':'~'} ${pins.length}p</span>`;
    el.addEventListener('click', ()=>{ activeNet = activeNet===name?null:name; draw(); buildHighlight(name); });
    list.appendChild(el);
  }
}

function buildHighlight(name) {
  document.querySelectorAll('.net-item').forEach(el=>el.classList.toggle('active', el.dataset.net===activeNet));
}

// ─── Canvas resize ───────────────────────────────────────────────────────────
function resize() {
  const wrap = cvs.parentElement;
  cvs.width  = wrap.clientWidth;
  cvs.height = wrap.clientHeight;
}
window.addEventListener('resize', ()=>{ resize(); draw(); });

// ─── Coordinate helpers ───────────────────────────────────────────────────────
function toScreen(x, y) { return [x*scale+viewX, y*scale+viewY]; }
function fromScreen(sx,sy) { return [(sx-viewX)/scale, (sy-viewY)/scale]; }

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  const W=cvs.width, H=cvs.height;
  ctx.fillStyle='#0d0d1a'; ctx.fillRect(0,0,W,H);

  // Board outline
  drawOutline(pcb.board_outlines[0].segments, BOARD_COLOR, 2);
  // Keepin
  drawOutline(pcb.route_keepins[0].segments, KEEPIN_COLOR, 1);

  // Copper pours (filled shapes)
  drawPours();

  // Wires from Freerouting
  if (routing) drawWires();

  // Pads
  drawPads();

  // Vias
  if (routing) drawVias();
}

function drawOutline(segs, color, lw) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.beginPath();
  for (const seg of segs) {
    const [sx, sy] = toScreen(seg.start[0], seg.start[1]);
    const [ex, ey] = toScreen(seg.end[0], seg.end[1]);
    if (seg.type === 'line') {
      ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
    } else if (seg.type === 'arc') {
      // Approximate arc with 20 intermediate points
      const [cx, cy] = toScreen(seg.center[0], seg.center[1]);
      const r = Math.hypot(sx-cx, sy-cy);
      const a1 = Math.atan2(sy-cy, sx-cx);
      const a2 = Math.atan2(ey-cy, ex-cx);
      const [mx, my] = toScreen(seg.arc_mid[0], seg.arc_mid[1]);
      const am = Math.atan2(my-cy, mx-cx);
      // determine direction
      let ta2 = a2;
      while (ta2 < a1) ta2 += 2*Math.PI;
      let tam = am;
      while (tam < a1) tam += 2*Math.PI;
      const ccw = tam <= ta2;
      ctx.arc(cx, cy, r, a1, a2, !ccw);
    }
  }
  ctx.stroke();
  ctx.restore();
}

function drawPours() {
  for (const s of pcb.shapes || []) {
    const poly = s.polygon;
    if (!poly || poly.length < 3) continue;
    const net = s.net;
    // Use a muted color
    const col = net==='D_GND'?'#1a3020':net==='USB_VBUS_C1'?'#1a2030':
                net==='AUDIO_GND'?'#201a30':'#1a2a1a';
    ctx.save();
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    const [px0, py0] = toScreen(poly[0][0], poly[0][1]);
    ctx.moveTo(px0, py0);
    for (let i=1; i<poly.length; i++) {
      const [px, py] = toScreen(poly[i][0], poly[i][1]);
      ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawWires() {
  const showAll = activeLayer==='ALL';
  for (const w of routing.wires) {
    if (!showAll && w.layer!==activeLayer) continue;
    if (activeNet && w.net!==activeNet) continue;
    const col = LAYER_COLOR[w.layer] || '#ffffff';
    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1, 75*scale/1000 * 2);
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath();
    const [px, py] = toScreen(w.pts[0][0]*1000, w.pts[0][1]*1000);
    ctx.moveTo(px, py);
    for (let i=1; i<w.pts.length; i++) {
      const [qx, qy] = toScreen(w.pts[i][0]*1000, w.pts[i][1]*1000);
      ctx.lineTo(qx, qy);
    }
    ctx.stroke();
    ctx.restore();
  }
}

function drawPads() {
  for (const c of pcb.components) {
    for (const p of c.pins) {
      const [bx, by, sx_b, sy_b] = p.bbox;
      const hw = (bx-sx_b)/2, hh = (by-sy_b)/2;
      const [px, py] = toScreen(p.x, p.y);
      const sw = hw*scale, sh = hh*scale;

      const isPour = POUR_NETS.has(p.net);
      const isActive = activeNet && p.net===activeNet;
      ctx.save();
      ctx.strokeStyle = isActive ? '#ffffff' : PAD_COLOR;
      ctx.fillStyle   = isPour ? '#1a3020' : '#0d1a0d';
      ctx.lineWidth   = isActive ? 2 : 1;
      ctx.fillRect(px-sw, py-sh, sw*2, sh*2);
      ctx.strokeRect(px-sw, py-sh, sw*2, sh*2);
      ctx.restore();
    }
  }
}

function drawVias() {
  const r = Math.max(2, VIA_COLOR && 300*scale/1000);
  for (const v of routing.vias) {
    const [vx, vy] = toScreen(v.x*1000, v.y*1000);
    ctx.save();
    ctx.fillStyle = VIA_COLOR;
    ctx.beginPath(); ctx.arc(vx, vy, Math.max(2,r), 0, 2*Math.PI); ctx.fill();
    ctx.restore();
  }
}

// ─── Interaction ──────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  activeLayer = t.dataset.layer;
  draw();
}));

cvs.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect = cvs.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const factor = e.deltaY<0 ? 1.15 : 1/1.15;
  viewX = mx - (mx-viewX)*factor;
  viewY = my - (my-viewY)*factor;
  scale *= factor;
  draw();
}, {passive:false});

cvs.addEventListener('mousedown', e=>{
  dragging=true; dragX=e.clientX; dragY=e.clientY;
  cvs.style.cursor='grabbing';
});
cvs.addEventListener('mouseup', ()=>{ dragging=false; cvs.style.cursor='crosshair'; });
cvs.addEventListener('mousemove', e=>{
  if (dragging) {
    viewX += e.clientX-dragX; viewY += e.clientY-dragY;
    dragX=e.clientX; dragY=e.clientY; draw();
  }
  const rect=cvs.getBoundingClientRect();
  const [wx,wy]=fromScreen(e.clientX-rect.left, e.clientY-rect.top);
  document.getElementById('pos').textContent =
    `x=${(wx/1000).toFixed(3)}mm  y=${(wy/1000).toFixed(3)}mm`;
});

// ─── Start ─────────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
